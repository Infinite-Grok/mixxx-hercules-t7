name: tests

on:
  push:
  pull_request:

jobs:
  offline-suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Mapping tests
        run: node tests/run.cjs res/controllers
      - name: Negative controls (the suite must catch known breakages)
        run: node tests/selftest.cjs
